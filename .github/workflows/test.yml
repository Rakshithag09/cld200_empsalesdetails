name: CAP Auto Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node
        uses: actions/setup-node@v3
        with:
          node-version: 18

      - name: Build CAP
        run: |
          npm ci
          npx cds build --production

      - name: Install MBT
        run: npm install -g mbt

      - name: Build MTAR
        run: mbt build -p cf

      - name: Install CF CLI
        run: |
          wget https://packages.cloudfoundry.org/stable?release=linux64-binary&source=github -O cf-cli.tgz
          tar -xvf cf-cli.tgz
          sudo mv cf /usr/local/bin

      - name: Install Multiapps Plugin
        run: cf install-plugin multiapps -f

      - name: Login to Cloud Foundry
        run: |
          cf login -a ${{ secrets.CF_API }} \
                   -u ${{ secrets.CF_USERNAME }} \
                   -p ${{ secrets.CF_PASSWORD }} \
                   -o ${{ secrets.CF_ORG }} \
                   -s ${{ secrets.CF_SPACE }}

      - name: Deploy
        run: cf deploy mta_archives/*.mtar -f
